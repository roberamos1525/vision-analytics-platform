[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-analytics-platform"
version = "0.1.0"
description = "Local computer-vision analytics: detection, tracking, motion, zone rules and evaluation with a FastAPI service."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Robert Ramos" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.9"]
scipy = ["scipy>=1.11"]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx2>=2.0"]

[project.scripts]
vap = "vap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "opencv: requires opencv-python-headless",
    "scipy: requires scipy",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = ["RUF012", "E501", "PT018", "PT011"]  # line length is enforced by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
